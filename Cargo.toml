[package]
name = "bpf"
version = "0.1.3"
authors = ["Frank Denis <github@pureftpd.org>"]
description = "Attach BPF filters"
license = "ISC"
homepage = "https://github.com/jedisct1/rust-bpf"
repository = "https://github.com/jedisct1/rust-bpf"
categories = ["os::unix-apis"]
edition = "2018"

[badges]
travis-ci = { repository = "jedisct1/rust-bpf" }

[features]
default = ["module"]
module = ["goblin"]

[dependencies]
libc = "0.2"
byteorder = "1.4"
goblin = {version = "0.6", optional = true}

[target.'cfg(target_os = "linux")'.dependencies]
bpf-sys = { git = "https://github.com/mworsley-cloudflare/redbpf.git", rev = "97cd230faa7bf9f44dbcf5b0e1f27731d2a914ed" }

